id: smoke
description: Smoke self-improvement loop over the Harvey smoke split.

seed_recipe: recipes/legal-agent
split_config: experiment_configs/smoke_split.yaml

evaluation:
  judges: [gpt-6-sol]
  parallel: 1

loop:
  max_epochs: 2
  test_every: 1

researcher:
  model: gpt-6-sol
  epoch_session_mode: fresh

verifier:
  model: gpt-6-sol
  enabled: true
  max_revision_attempts: 2
