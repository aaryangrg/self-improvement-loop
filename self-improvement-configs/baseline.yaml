id: baseline
description: Baseline self-improvement loop over the Harvey baseline split.

seed_recipe: recipes/legal-agent
split_config: experiment_configs/baseline_split.yaml

evaluation:
  judges: [gpt-6-sol]
  reasoning_effort: medium
  parallel: 1

loop:
  max_epochs: 10
  test_every: 3
  max_code_revisions: 5

researcher:
  model: gpt-6-sol
  reasoning_effort: xhigh
  epoch_session_mode: fresh

verifier:
  model: gpt-6-sol
  reasoning_effort: medium
  enabled: true
  max_revision_attempts: 2
